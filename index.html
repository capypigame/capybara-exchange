<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Capybara Exchange</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #121212; color: #e0c98c; padding: 20px 16px; min-height: 100vh; }
        .header { text-align: center; margin-bottom: 30px; }
        .logo { width: 120px; height: 120px; border-radius: 50%; margin-bottom: 12px; border: 2px solid #e0c98c; }
        h1 { font-size: 32px; margin-bottom: 8px; color: #e0c98c; }
        .subtitle { font-size: 16px; opacity: 0.8; line-height: 1.5; }
        .stats-card { background: #1e1e1e; border-radius: 12px; padding: 20px; margin-bottom: 24px; border: 1px solid #333; }
        .stat-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .stat-row:last-child { margin-bottom: 0; }
        .stat-label { font-size: 16px; opacity: 0.7; }
        .stat-value { font-size: 20px; font-weight: bold; color: #e0c98c; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 24px; }
        .btn { padding: 16px 12px; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s; border: 1px solid #e0c98c; }
        .btn-primary { background: #e0c98c; color: #121212; }
        .btn-secondary { background: transparent; color: #e0c98c; }
        .btn:hover { transform: translateY(-2px); }
        .btn:active { transform: translateY(0); }
        .section-title { font-size: 18px; margin-bottom: 12px; opacity: 0.9; }
        .full-btn { width: 100%; margin-bottom: 14px; background: #1e1e1e; color: #e0c98c; border: 1px solid #e0c98c; }
        .toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(20, 20, 20, 0.95); color: white; padding: 24px; border-radius: 12px; text-align: center; z-index: 999; display: none; border: 1px solid #e0c98c; max-width: 85%; }
        .toast button { margin-top: 16px; padding: 8px 20px; background: #e0c98c; color: #121212; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
<div class="header">
    <img src="https://i.imgur.com/Th5oMqA.jpeg" alt="Capybara Exchange" class="logo">
    <h1>Capybara Exchange</h1>
    <p class="subtitle">Digital Shares • Profit-Sharing Dividends • USDT on TON</p>
</div>
<div class="stats-card">
    <div class="stat-row"><span class="stat-label">Your Shares</span><span class="stat-value">-- Units</span></div>
    <div class="stat-row"><span class="stat-label">Dividends Earned</span><span class="stat-value">-- USDT</span></div>
</div>
<div class="toast" id="toast">
    <p>Command sent! Please check your bot chat below.</p>
    <button onclick="closeToast()">Close</button>
</div>
<div class="btn-grid">
    <button class="btn btn-primary" onclick="sendAction('buy')">🛒 Buy Shares</button>
    <button class="btn btn-secondary" onclick="sendAction('sell')">💰 Sell Shares</button>
    <button class="btn btn-secondary" onclick="sendAction('claim')">📥 Claim Dividends</button>
    <button class="btn btn-secondary" onclick="sendAction('account')">📊 My Account</button>
</div>
<div class="section-title">Swap & Market</div>
<button class="btn full-btn" onclick="alert('Coming soon: TON ↔ USDT ↔ Tokens')">TON ↔ USDT ↔ Tokens</button>
<button class="btn full-btn" onclick="alert('Coming soon: Sales Trend')">📈 Sales Trend</button>
<button class="btn full-btn" onclick="alert('Coming soon: Sales Chart')">📊 SALES CHART</button>
<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();
function sendAction(action) { tg.sendData(action); showToast(); }
function showToast() { document.getElementById('toast').style.display = 'block'; }
function closeToast() { document.getElementById('toast').style.display = 'none'; }
</script>
</body>
</html>
