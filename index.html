<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capybara Exchange</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            dark: '#0F0F0F',
            card: '#1A1A1A',
            gold: '#D4AF37',
            goldLight: '#F9DC73',
            goldSoft: '#FFF2CC',
          },
          fontFamily: {
            sans: ['Inter','sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body{background:radial-gradient(circle at top,#1A170E,#0F0F0F 55%)}
    .btn-gold{background:linear-gradient(135deg,#D4AF37,#B8860B);color:#000;font-weight:bold;transition:all 0.2s}
    .btn-gold:hover{background:linear-gradient(135deg,#F9DC73,#D4AF37);transform:translateY(-1px)}
    .btn-dark{background:#252525;border:1px solid #D4AF37;transition:all 0.2s}
    .btn-dark:hover{background:#1F1F1F;border-color:#F9DC73}
    .card{border:1px solid rgba(212,175,55,0.2);box-shadow:0 0 18px rgba(212,175,55,0.08)}
    .glow{text-shadow:0 0 12px rgba(249,220,115,0.35)}
  </style>
</head>
<body class="text-goldSoft min-h-screen max-w-md mx-auto p-4">
  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.setHeaderColor('#0F0F0F');
    tg.expand();
  </script>

  <!-- HEADER & LOGO -->
  <div class="text-center mb-5">
    <!-- Use DIRECT image link (not album link) -->
    <img src="https://i.imgur.com/Tflctl7.jpeg" alt="Capybara Exchange Logo" class="w-24 h-24 mx-auto mb-3 rounded-xl border border-gold/40">
    <h1 class="text-3xl font-bold glow">Capybara Exchange</h1>
    <p class="text-sm opacity-70 mt-1">Digital Shares • Profit-Sharing Dividends • USDT on TON</p>
  </div>

  <!-- ACCOUNT SUMMARY -->
  <div class="card bg-card rounded-2xl p-4 mb-4">
    <div class="flex justify-between items-center mb-3">
      <span class="opacity-80">Your Shares</span>
      <span class="text-2xl font-bold text-goldLight">-- Units</span>
    </div>
    <div class="flex justify-between items-center mb-3">
      <span class="opacity-80">Dividends Earned</span>
      <span class="text-xl font-semibold text-goldLight">-- USDT</span>
    </div>
    <div class="flex justify-between items-center">
      <span class="opacity-80">Estimated Annual Payout</span>
      <span class="text-lg font-medium text-gold">-- USDT</span>
    </div>
  </div>

  <!-- MAIN ACTIONS -->
  <div class="grid grid-cols-2 gap-3 mb-4">
    <button class="btn-gold rounded-xl py-3.5" onclick="send('buy')">🛒 Buy Shares</button>
    <button class="btn-dark rounded-xl py-3.5 text-goldLight" onclick="send('sell')">💰 Sell Shares</button>
    <button class="btn-dark rounded-xl py-3.5 text-goldLight" onclick="send('claim')">📥 Claim Dividends</button>
    <button class="btn-dark rounded-xl py-3.5 text-goldLight" onclick="send('me')">📊 My Account</button>
  </div>

  <!-- SWAP & MARKET -->
  <div class="card bg-card rounded-2xl p-4 mb-4">
    <h3 class="font-bold mb-3 text-goldLight">🔄 Swap & Market</h3>
    <button class="btn-dark rounded-xl py-3 w-full text-goldLight mb-2" onclick="openLink('https://ston.fi/swap')">
      TON ↔ USDT ↔ Tokens
    </button>
    <button class="btn-dark rounded-xl py-3 w-full text-goldLight" onclick="send('chart')">
      📈 Sales Trend
    </button>
  </div>

  <!-- SALES CHART -->
  <div class="card bg-card rounded-2xl p-4">
    <h3 class="font-bold mb-3 text-goldLight">📊 SALES CHART</h3>
    <canvas id="salesChart" height="150"></canvas>
  </div>

  <script>
    // Open external links
    function openLink(url){ tg.openLink(url) }
    // Send command to bot — app stays open
    function send(command){
      tg.sendData('/' + command);
      tg.showAlert("Command sent! Please check your bot chat below.");
    }
    // Sales chart
    new Chart(document.getElementById('salesChart'),{
      type:'line',
      data:{
        labels:['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],
        datasets:[{
          label:'Units Sold',
          data:[8,15,10,22,18,30,25],
          borderColor:'#D4AF37',
          backgroundColor:'rgba(212,175,55,0.12)',
          tension:0.3,
          fill:true
        }]
      },
      options:{
        responsive:true,
        plugins:{legend:{labels:{color:'#F9DC73'}}},
        scales:{
          x:{ticks:{color:'rgba(249,220,115,0.7)'},grid:{color:'rgba(212,175,55,0.1)'}},
          y:{ticks:{color:'rgba(249,220,115,0.7)'},grid:{color:'rgba(212,175,55,0.1)'}}
        }
      }
    })
  </script>
</body>
</html>
