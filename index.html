<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🦫 CAPYBARA EXCHANGE</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gelap: '#0F0F0F',
            kartu: '#1A1A1A',
            emas: '#D4AF37',
            emasTerang: '#F9DC73',
            emasMuda: '#FFF2CC',
          },
          fontFamily: {
            sans: ['Inter','sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body{background:radial-gradient(circle at top,#1A170E,#0F0F0F 55%)}
    .btn-emas{background:linear-gradient(135deg,#D4AF37,#B8860B);color:#000;font-weight:bold;transition:all 0.2s}
    .btn-emas:hover{background:linear-gradient(135deg,#F9DC73,#D4AF37);transform:translateY(-1px)}
    .btn-gelap{background:#252525;border:1px solid #D4AF37;transition:all 0.2s}
    .btn-gelap:hover{background:#1F1F1F;border-color:#F9DC73}
    .card{border:1px solid rgba(212,175,55,0.2);box-shadow:0 0 18px rgba(212,175,55,0.08)}
    .kilap{text-shadow:0 0 12px rgba(249,220,115,0.35)}
  </style>
</head>
<body class="text-emasMuda min-h-screen max-w-md mx-auto p-4">
  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.setHeaderColor('#0F0F0F');
    tg.expand();
  </script>

  <!-- JUDUL DAN LOGO -->
  <div class="text-center mb-5">
    <img src="https://i.imgur.com/7CBIS0B.png" alt="Logo Capybara" class="w-24 h-24 mx-auto mb-3 rounded-xl border border-emas/40">
    <h1 class="text-3xl font-bold kilap">🦫 CAPYBARA EXCHANGE</h1>
    <p class="text-sm opacity-70 mt-1">Saham Digital • Dividen 6%/Tahun • USDT TON</p>
  </div>

  <!-- KARTU DATA UTAMA -->
  <div class="card bg-kartu rounded-2xl p-4 mb-4">
    <div class="flex justify-between items-center mb-3">
      <span class="opacity-80">Unit Saham Kamu</span>
      <span class="text-2xl font-bold text-emasTerang">-- Unit</span>
    </div>
    <div class="flex justify-between items-center mb-3">
      <span class="opacity-80">Dividen Terkumpul</span>
      <span class="text-xl font-semibold text-emasTerang">-- USDT</span>
    </div>
    <div class="flex justify-between items-center">
      <span class="opacity-80">Perkiraan/Tahun</span>
      <span class="text-lg font-medium text-emas">-- USDT</span>
    </div>
  </div>

  <!-- TOMBOL UTAMA -->
  <div class="grid grid-cols-2 gap-3 mb-4">
    <button class="btn-emas rounded-xl py-3.5" onclick="kirim('beli')">🛒 Beli Unit</button>
    <button class="btn-gelap rounded-xl py-3.5 text-emasTerang" onclick="kirim('jual')">💰 Jual Unit</button>
    <button class="btn-gelap rounded-xl py-3.5 text-emasTerang" onclick="kirim('klaim')">📥 Ambil Dividen</button>
    <button class="btn-gelap rounded-xl py-3.5 text-emasTerang" onclick="kirim('saya')">📊 Data Akun</button>
  </div>

  <!-- SWAP & PASAR -->
  <div class="card bg-kartu rounded-2xl p-4 mb-4">
    <h3 class="font-bold mb-3 text-emasTerang">🔄 Tukar & Pasar</h3>
    <button class="btn-gelap rounded-xl py-3 w-full text-emasTerang mb-2" onclick="buka('https://ston.fi/swap')">
      TON ↔ USDT ↔ Token
    </button>
    <button class="btn-gelap rounded-xl py-3 w-full text-emasTerang" onclick="kirim('grafik')">
      📈 Tren Penjualan
    </button>
  </div>

  <!-- GRAFIK PASAR -->
  <div class="card bg-kartu rounded-2xl p-4">
    <h3 class="font-bold mb-3 text-emasTerang">📊 GRAFIK PENJUALAN</h3>
    <canvas id="grafik" height="150"></canvas>
  </div>

  <script>
    // BUKA HALAMAN LUAR
    function buka(link){tg.openLink(link)}
    // KIRIM PERINTAH KE BOT - TANPA MENUTUP APLIKASI
    function kirim(perintah){
      tg.sendData('/' + perintah);
      tg.showAlert("Perintah dikirim! Cek pesan bot di bawah ya.");
    }
    // GRAFIK OTOMATIS
    new Chart(document.getElementById('grafik'),{
      type:'line',
      data:{
        labels:['Sen','Sel','Rab','Kam','Jum','Sab','Min'],
        datasets:[{
          label:'Unit Terjual',
          data:[8,15,10,22,18,30,25],
          borderColor:'#D4AF37',
          backgroundColor:'rgba(212,175,55,0.12)',
          tension:0.3,
          fill:true
        }]
      },
      options:{
        responsive:true,
        plugins:{legend:{labels:{color:'#F9DC73'}}},
        scales:{
          x:{ticks:{color:'rgba(249,220,115,0.7)'},grid:{color:'rgba(212,175,55,0.1)'}},
          y:{ticks:{color:'rgba(249,220,115,0.7)'},grid:{color:'rgba(212,175,55,0.1)'}}
        }
      }
    })
  </script>
</body>
</html>
